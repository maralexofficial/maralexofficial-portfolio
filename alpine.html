
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Alpine.js Test</title>

    <script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            background: #0b0d10;
            color: #f5f5f5;
        }

        section {
            margin-bottom: 24px;
            padding: 24px;
            border: 1px solid #333;
            border-radius: 12px;
        }

        button {
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            cursor: pointer;
        }

        [x-cloak] {
            display: none !important;
        }

        .status {
            color: #4ade80;
        }
    </style>
</head>

<body>

    <h1>Alpine.js Playground</h1>

    <section x-data="{ message: 'Hello World! Alpine.js läuft 🚀' }">
        <h2>Hello World</h2>
        <p x-text="message"></p>
        <p class="status">Wenn du diesen Text siehst, funktioniert Alpine.</p>
    </section>

    <section x-data="{ open: false }">
        <h2>Toggle Test</h2>

        <button
            type="button"
            @click="open = !open"
            x-text="open ? 'Schließen' : 'Öffnen'"
        ></button>

        <p x-cloak x-show="open" x-transition>
            🎉 Alpine.js funktioniert inklusive Interaktionen!
        </p>
    </section>

    <section>
        <h2>Debugging</h2>
        <p id="status">Warte auf Alpine.js …</p>
    </section>

    <script>
        document.addEventListener('alpine:init', () => {
            document.getElementById('status').textContent =
                'Alpine.js wurde erfolgreich initialisiert.';
        });

        document.addEventListener('alpine:initialized', () => {
            document.getElementById('status').textContent =
                'Alpine.js läuft vollständig. ✓';
        });
    </script>

</body>
</html>
