
name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify project files
        run: |
          test -f index.html || {
            echo "::error::index.html fehlt im Repository-Stammverzeichnis."
            exit 1
          }

          test -f package.json || {
            echo "::error::package.json fehlt."
            exit 1
          }

          test -f src/input.css || {
            echo "::error::src/input.css fehlt."
            exit 1
          }

      - name: Install dependencies
        run: npm install

      - name: Build Tailwind CSS
        run: npm run build

      - name: Verify generated CSS
        run: |
          if [ ! -s dist/output.css ]; then
            echo "::error::Tailwind hat keine CSS-Datei erzeugt."
            exit 1
          fi

          echo "CSS-Datei erfolgreich erstellt:"
          wc -c dist/output.css

          if ! grep -q '\.text-accent' dist/output.css; then
            echo "::warning::Die erwartete Klasse .text-accent wurde nicht gefunden."
          fi

      - name: Prepare website
        run: |
          mkdir -p _site/dist

          cp index.html _site/index.html
          cp dist/output.css _site/dist/output.css

          echo "Dateien im Deployment:"
          find _site -maxdepth 3 -type f -print

      - name: Verify deployment files
        run: |
          test -s _site/index.html || {
            echo "::error::index.html fehlt im Deployment."
            exit 1
          }

          test -s _site/dist/output.css || {
            echo "::error::CSS fehlt im Deployment-Artefakt."
            exit 1
          }

          echo "Deployment-Dateien erfolgreich geprüft."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
